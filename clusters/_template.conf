# Copy to <cluster>.conf after validating modules and queues.
# This is a Hygon Z100/DCU-oriented template, not a live availability claim.
# Keep site-specific paths, hostnames and credentials out of the public repo.
CLUSTER_ID="example-z100"
OPENAPI_REGION_ID=""
CPU_PARTITION="normal"
DCU_PARTITION="accelerator"
GROMACS_MODULE="gromacs/2026.3"
GROMACS_GPU_MODULE="gromacs/2026.3-dtk26.04-z100"
GROMACS_EXPECT_VERSION="2026.3"
GPU_ARCH="gfx906"
CPUS_PER_JOB=2
DCUS_PER_JOB=1
WALLTIME="00:15:00"
