# Copy to <cluster>.conf after validating modules and queues.
# This is a Hygon Z100/DCU-oriented template, not a live availability claim.
# Keep site-specific paths, hostnames and credentials out of the public repo.
CLUSTER_ID="example-z100"
OPENAPI_REGION_ID=""
CPU_PARTITION="normal"
DCU_PARTITION="accelerator"
GROMACS_MODULE="gromacs/2026.3"
GROMACS_GPU_MODULE="gromacs/2026.3-dtk26.04-z100"
GROMACS_BINARY="gmx_mpi"
GROMACS_EXPECT_VERSION="2026.3"
GPU_ARCH="gfx906"
CPUS_PER_JOB=2
DCUS_PER_JOB=1
NODES=1
MPI_RANKS=1
MPI_RANKS_PER_NODE=""
OMP_THREADS=2
MPI_LAUNCHER="srun"
NPME=""
FORCE_GPU_AWARE_MPI=0
REQUIRE_GPU_AWARE_MPI=0
SCHEDULER_OPTIONS=""
WALLTIME="00:15:00"
# Multi-GPU example: MPI_RANKS=2, DCUS_PER_JOB=2, CPUS_PER_JOB=4
# Cross-node example: NODES=2, MPI_RANKS=4, MPI_RANKS_PER_NODE=2,
#   DCUS_PER_JOB=2, CPUS_PER_JOB=8
# Slurm PMIx (self-built OpenMPI 5):
# MPI_ENV_SLURM_MPI_TYPE="pmix"
# Site-specific UCX HCA selection, if the default HCA path fails:
# MPI_ENV_UCX_NET_DEVICES="mlx5_0:1"
# Optional private modulefile directory for a candidate build:
# GROMACS_MODULEPATH="/private/modulefiles"
# For a user-owned build without a module:
# GROMACS_MODULE=""
# GROMACS_GPU_MODULE=""
# GROMACS_BINARY="/absolute/path/to/gmx_mpi"
# GROMACS_ENV_SCRIPT="/absolute/path/to/env.sh"
# Optional MPI environment overrides, e.g. platform OpenMPI UCX fallback:
# MPI_ENV_OMPI_MCA_PML="ob1"
