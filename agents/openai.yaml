interface:
  display_name: "SCNet GROMACS"
  short_description: "Validate GROMACS CPU, HIP/DCU and PME GPU module runs on SCNet"
  default_prompt: "Use $scnet-gromacs to check a GROMACS module, run the bundled CPU oracle and optional HIP/DCU or PME GPU cases through scnet-hpc OpenAPI, then compare CPU and HIP energies with the documented tolerance."

policy:
  allow_implicit_invocation: true
